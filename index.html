<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard Pneus</title>
    <link rel="stylesheet" href="./assets/css/style.css" />
    <link href="./output.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  </head>
  <body>
    <div class="overflow-hidden" id="container-layout" class="sidebar-open">
      <header class="w-full !px-4 flex justify-between items-center">
        <div class="header-logo text-xl font-serif">
          <span class="emoji">&#128202;</span>
          <p class="text-black-russian font-black">Dashboard</p>
          <span class="text-cinza-claro">Visão geral da frota</span>
        </div>

        <div class="header-buttons flex items-center gap-4 font-serif">
          <button
            id="btn-atualizar"
            class="flex items-center justify-center w-24 h-8 bg-custom-button rounded-lg hover:bg-custom-button-hover hover:text-white transition-colors cursor-pointer"
          >
            Atualizar
          </button>

          <button
            class="flex items-center justify-center p-12 w-8 h-8 rounded-lg border-2 border-gray-50 hover:border-amber-100 hover:bg-amber-100 cursor-pointer"
          >
            &#128276;
          </button>
        </div>
      </header>

      <button id="btn-hamburguer" class="btn-hamburguer">
        <i class="fa-solid fa-bars"></i>
      </button>

      <nav class="menu" id="menu">
        <div class="logo">
          <i class="fa-solid fa-car" style="color: white"></i>
          <p>Departamento de Pneus <span>Gestao e Qualidade</span></p>
        </div>
        <ul>
          <li><a href="/index.html">Dashboard</a></li>
          <li><a href="assets/pages/pneus.html">Pneus</a></li>
          <li><a href="assets/pages/veiculos.html">Veículos</a></li>
          <li><a href="assets/pages/movimentacao.html">Movimentações</a></li>
          <li><a href="assets/pages/estoque.html">Estoque</a></li>
          <li><a href="assets/pages/recapadora.html">Recapadora</a></li>
          <li><a href="assets/pages/sulco.html">Sulcos</a></li>
          <li><a href="assets/pages/sucateamento.html">Sucatas</a></li>
        </ul>
      </nav>

      <main class="containerPrincipal dashboardPrincipal" id="containerPrincipal">
        <div class="containerIndicadores" id="metricaDashBoard"></div>
        <div class="containerDashboard">
          <div class="dash-row-1">
            <div class="form-titulo-container">
              <div class="form-titulo">
                <h3>Ultimas 3 contagem</h3>
              </div>
            </div>
            <div class="table-container">
              <table id="catalagoContagemF" class="table-container-contagemF">
                <thead>
                  <tr>
                    <th scope="col">Deletar</th>
                    <th scope="col">Medida</th>
                    <th scope="col">Novo</th>
                    <th scope="col">Reformado</th>
                    <th scope="col">Meia Vida</th>
                    <th scope="col">C. Interno</th>
                    <th scope="col">P/ Reforma</th>
                    <th scope="col">Sucateado</th>
                    <th scope="col">Total</th>
                  </tr>
                </thead>
                <tbody></tbody>
              </table>
            </div>
          </div>
          <div class="dash-row-2">
            <div><div class="localizacaoSistema"></div></div>
            <div><div class="lastMovimentacoes"></div></div>
          </div>
          <div class="dash-row-3">
            <div><canvas class="graphSulcoTotal"></canvas></div>
            <div><canvas class="graphSulGaragem-3"></canvas></div>
            <div><canvas class="graphSulcoVida"></canvas></div>
          </div>
          <div class="dash-row-4"></div>
        </div>
      </main>
    </div>
    <script type="module" src="assets/js/script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  </body>
</html>
