<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Dashboard Pneus</title>

    <link rel="stylesheet" href="../css/style.css" />
    <link href="../../output.css" rel="stylesheet" />

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  </head>

  <body>
    <div id="container-layout" class="sidebar-open overflow-hidden layout-com-submenu">
      <!-- =========================
           HEADER
      ========================== -->

      <header class="w-full !px-14 flex justify-between items-center">
        <div class="header-logo text-xl font-sans">
          <span class="emoji">&#128202;</span>

          <p class="text-black-russian font-bold">Dashboard</p>

          <span class="text-cinza-claro"> Visão geral da frota </span>
        </div>

        <div class="header-buttons flex items-center gap-4 font-sans">
          <button id="btn-atualizar" type="button" class="btn btn-primary">Atualizar</button>

          <button
            type="button"
            class="flex items-center justify-center p-2 w-8 h-8 rounded-lg border-2 border-gray-50 hover:border-amber-100 hover:bg-amber-100 cursor-pointer"
            aria-label="Notificações"
          >
            &#128276;
          </button>
        </div>
      </header>

      <!-- =========================
           HAMBÚRGUER
      ========================== -->

      <button id="btn-hamburguer" class="btn-hamburguer" type="button" aria-label="Abrir menu">
        <i class="fa-solid fa-bars"></i>
      </button>

      <!-- =========================
           MENU LATERAL
      ========================== -->

      <nav class="menu" id="menu">
        <div class="logo">
          <i class="fa-solid fa-car" style="color: white"></i>

          <p>
            Departamento de Pneus
            <span>Gestao e Qualidade</span>
          </p>
        </div>

        <ul>
          <li>
            <a href="../../index.html"> Dashboard </a>
          </li>

          <li>
            <a href="pneus.html"> Pneus </a>
          </li>

          <li>
            <a href="veiculos.html"> Veículos </a>
          </li>

          <li>
            <a href="movimentacao.html"> Movimentações </a>
          </li>

          <li>
            <a href="estoque.html"> Estoque </a>
          </li>

          <li>
            <a href="recapadora.html"> Recapadora </a>
          </li>

          <li>
            <a href="sulco.html"> Sulcos </a>
          </li>

          <li>
            <a href="sucateamento.html"> Sucatas </a>
          </li>
        </ul>
      </nav>

      <!-- =========================
           SUBMENU
      ========================== -->

      <section class="sub-menu" id="sub-menu">
        <ul>
          <li>Ativos</li>
          <li>GNS</li>
        </ul>
      </section>

      <!-- =========================
           CONTEÚDO PRINCIPAL
      ========================== -->

      <main class="containerPrincipal" id="containerPrincipal">
        <!-- ===================================
             VEÍCULOS ATIVOS
        ==================================== -->

        <section class="veiculoPage">
          <!-- Indicadores -->

          <div class="containerIndicadores" id="metricaVeiculos"></div>

          <!-- Pesquisa / filtros -->

          <div class="searchPneus grid-2">
            <input type="text" placeholder="Buscar por Nr. Fogo, marca ou veículo..." id="pesquisar" />

            <div class="searchSelect">
              <select name="garagemAtivos" id="garagemAtivos">
                <option value="" disabled selected>Garagem</option>

                <option value="itaquera">Itaquera</option>

                <option value="limeira">Limeira</option>

                <option value="juizDeFora">Juiz de Fora</option>
              </select>

              <select name="vidaAtivos" id="vidaAtivos">
                <option value="" disabled selected>Vida</option>

                <option value="N">N</option>
                <option value="R1">R1</option>
                <option value="R2">R2</option>
                <option value="R3">R3</option>
                <option value="R4">R4</option>
                <option value="R5">R5</option>
                <option value="R6">R6</option>
                <option value="R7">R7</option>
                <option value="R8">R8</option>
                <option value="R9">R9</option>
              </select>
            </div>
          </div>

          <!-- Catálogo -->

          <div class="layout-catalogo">
            <div class="table-container">
              <table id="catalagoCarrosAtivos" class="table-system">
                <thead>
                  <tr>
                    <th scope="col">Prefixo</th>
                    <th scope="col">Garagem</th>
                    <th scope="col">Tamanho</th>
                    <th scope="col">Cor</th>
                    <th scope="col">Ano</th>
                    <th scope="col">Posição</th>
                    <th scope="col">Status</th>
                  </tr>
                </thead>

                <tbody id="CatalagoCarros"></tbody>
              </table>
            </div>
          </div>
        </section>

        <!-- ===================================
             VEÍCULOS GNS
        ==================================== -->

        <section class="veiculoGns">
          <!-- Indicadores -->

          <div class="containerIndicadores" id="metricaGns"></div>

          <!-- Pesquisa / filtros -->

          <div class="searchPneus grid-2">
            <input type="text" placeholder="Buscar por Nr. Fogo, marca ou veículo..." id="pesquisar" />

            <div class="searchSelect">
              <select name="garagemGns" id="garagemGns">
                <option value="" disabled selected>Garagem</option>

                <option value="itaquera">Itaquera</option>

                <option value="limeira">Limeira</option>

                <option value="juizDeFora">Juiz de Fora</option>
              </select>

              <select name="vidaGns" id="vidaGns">
                <option value="" disabled selected>Vida</option>

                <option value="N">N</option>
                <option value="R1">R1</option>
                <option value="R2">R2</option>
                <option value="R3">R3</option>
                <option value="R4">R4</option>
                <option value="R5">R5</option>
                <option value="R6">R6</option>
                <option value="R7">R7</option>
                <option value="R8">R8</option>
                <option value="R9">R9</option>
              </select>
            </div>
          </div>

          <!-- Catálogo GNS -->

          <div class="layout-catalogo">
            <div class="table-container">
              <table id="catalagoCarrosGns" class="table-system">
                <thead>
                  <tr>
                    <th scope="col">Prefixo</th>
                    <th scope="col">Garagem</th>
                    <th scope="col">Tamanho</th>
                    <th scope="col">Cor</th>
                    <th scope="col">Ano</th>
                    <th scope="col">Posição</th>
                    <th scope="col">Status</th>
                  </tr>
                </thead>

                <tbody id="CatalagoCarros2"></tbody>
              </table>
            </div>
          </div>
        </section>
      </main>
    </div>

    <script type="module" src="../js/script.js"></script>
  </body>
</html>
